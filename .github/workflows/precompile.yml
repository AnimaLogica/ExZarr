name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Attach built assets to an existing GitHub Release (needed when re-running
      # after a workflow fix without moving the tag).
      release_tag:
        description: "Existing release tag to upload assets to (e.g. v1.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds — ZigCodecs dynamically links system compression libs
          - { target: x86_64-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-macos-none, os: macos-15 }
          - { target: x86_64-windows-gnu, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install compression libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev liblz4-dev libsnappy-dev libblosc-dev libbz2-dev

      - name: Install compression libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy c-blosc bzip2

      - name: Install MSYS2 compression libraries (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          # MINGW64 is deprecated; UCRT64 is the current MinGW environment
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-lz4
            mingw-w64-ucrt-x86_64-snappy
            mingw-w64-ucrt-x86_64-blosc
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-pkgconf

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Build NIF artifact
        shell: bash
        env:
          EX_ZARR_BUILD: "1"
          ZIGLER_RELEASE_MODE: fast
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          # Absolute Windows path from setup-msys2 (Git Bash maps bare /ucrt64
          # under Program Files\Git, which breaks Zig -L/-I).
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -z "${MSYS2_LOCATION:-}" ]]; then
              echo "MSYS2_LOCATION is empty; setup-msys2 did not report a path" >&2
              exit 1
            fi
            # D:\a\_temp\msys64 -> D:/a/_temp/msys64/ucrt64 (Zig wants drive paths)
            prefix="${MSYS2_LOCATION//\\//}/ucrt64"
            export COMPRESSION_LIB_DIRS="${prefix}/lib"
            export COMPRESSION_INCLUDE_DIRS="${prefix}/include"
            export PATH="${prefix}/bin:${PATH}"
            echo "COMPRESSION_LIB_DIRS=${COMPRESSION_LIB_DIRS}"
            test -d "${COMPRESSION_LIB_DIRS}"
            test -f "${COMPRESSION_LIB_DIRS}/libzstd.dll.a" \
              || test -f "${COMPRESSION_LIB_DIRS}/libzstd.a"
          fi

          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix zig.get

          mix zigler_precompiled.build lib/ex_zarr/codecs/zig_codecs.ex \
            --target "${{ matrix.target }}" \
            --out artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/*.tar.gz
