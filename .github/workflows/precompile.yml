name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds only — ZigCodecs dynamically links system compression libs
          - { target: x86_64-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-macos-none, os: macos-15 }
          - { target: x86_64-macos-none, os: macos-13 }

    steps:
      - uses: actions/checkout@v4

      - name: Install compression libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev liblz4-dev libsnappy-dev libblosc-dev libbz2-dev

      - name: Install compression libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy c-blosc bzip2

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Build NIF artifact
        shell: bash
        env:
          EX_ZARR_BUILD: "1"
          ZIGLER_RELEASE_MODE: fast
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix zig.get

          mix zigler_precompiled.build lib/ex_zarr/codecs/zig_codecs.ex \
            --target "${{ matrix.target }}" \
            --out artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
