name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Attach built assets to an existing GitHub Release (needed when re-running
      # after a workflow fix without moving the tag).
      release_tag:
        description: "Existing release tag to upload assets to (e.g. v1.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds — ZigCodecs dynamically links system compression libs
          - { target: x86_64-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-macos-none, os: macos-15 }
          - { target: x86_64-windows-gnu, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install compression libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev liblz4-dev libsnappy-dev libblosc-dev libbz2-dev

      - name: Install compression libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy c-blosc bzip2

      - name: Install MSYS2 compression libraries (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          # MINGW64 is deprecated; UCRT64 is the current MinGW environment
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-lz4
            mingw-w64-ucrt-x86_64-snappy
            mingw-w64-ucrt-x86_64-blosc
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cc

      # Zigler 0.16 requires Zig 0.16 — do not pin to 0.15.x
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # Needed for zig translate-c -lc on Windows (MSVC libc)
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Build NIF artifact
        shell: bash
        env:
          EX_ZARR_BUILD: "1"
          ZIGLER_RELEASE_MODE: fast
          # Absolute Windows path from setup-msys2 (Git Bash maps bare /ucrt64
          # under Program Files\Git, which breaks Zig -L/-I).
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail

          # Pin ONE Zig. On Windows, `command -v zig` returns a Git Bash path
          # (/c/...) that Elixir File.exists?/1 rejects — Zigler then ignores
          # ZIG_EXECUTABLE_PATH and uses its own cached Zig. Use cygpath -m.
          zig_bash="$(command -v zig)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export ZIG_EXECUTABLE_PATH="$(cygpath -m "${zig_bash}")"
          else
            export ZIG_EXECUTABLE_PATH="${zig_bash}"
          fi
          echo "Using Zig at ${ZIG_EXECUTABLE_PATH}"
          zig version

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -z "${MSYS2_LOCATION:-}" ]]; then
              echo "MSYS2_LOCATION is empty; setup-msys2 did not report a path" >&2
              exit 1
            fi
            # D:\a\_temp\msys64 -> D:/a/_temp/msys64/ucrt64 (Zig wants drive paths)
            prefix="${MSYS2_LOCATION//\\//}/ucrt64"
            export COMPRESSION_LIB_DIRS="${prefix}/lib"
            export COMPRESSION_INCLUDE_DIRS="${prefix}/include"
            export PATH="${prefix}/bin:${PATH}"
            echo "COMPRESSION_LIB_DIRS=${COMPRESSION_LIB_DIRS}"
            test -d "${COMPRESSION_LIB_DIRS}"
            test -f "${COMPRESSION_LIB_DIRS}/libzstd.dll.a" \
              || test -f "${COMPRESSION_LIB_DIRS}/libzstd.a"

            # Fresh Zig caches (default %LOCALAPPDATA%\zig was hitting CacheCheckFailed
            # during translate-c of erl_nif_win.h). One Zig + clean temp dirs.
            export ZIG_GLOBAL_CACHE_DIR="$(cygpath -m "${RUNNER_TEMP}")/zig-global-cache"
            export ZIG_LOCAL_CACHE_DIR="$(cygpath -m "${RUNNER_TEMP}")/zig-local-cache"
            rm -rf "${ZIG_GLOBAL_CACHE_DIR}" "${ZIG_LOCAL_CACHE_DIR}" .zig-cache \
              "$(cygpath -u "${LOCALAPPDATA}")/zig" 2>/dev/null || true
            mkdir -p "${ZIG_GLOBAL_CACHE_DIR}" "${ZIG_LOCAL_CACHE_DIR}"
            echo "ZIG_GLOBAL_CACHE_DIR=${ZIG_GLOBAL_CACHE_DIR}"
            echo "ZIG_LOCAL_CACHE_DIR=${ZIG_LOCAL_CACHE_DIR}"
          fi

          mix local.hex --force
          mix local.rebar --force
          mix deps.get

          # Prove Elixir can see the pinned Zig (catches Git Bash path bugs)
          mix run -e 'path = System.get_env("ZIG_EXECUTABLE_PATH"); unless path && File.exists?(path), do: raise("ZIG_EXECUTABLE_PATH not visible to Elixir: #{inspect(path)}")'

          # Prefer the pinned setup-zig binary; still run zig.get for Zigler bookkeeping
          mix zig.get

          mix zigler_precompiled.build lib/ex_zarr/codecs/zig_codecs.ex \
            --target "${{ matrix.target }}" \
            --out artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/*.tar.gz
