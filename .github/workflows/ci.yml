name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    # Optional services for integration tests (not needed for CI)
    # Uncomment if running tests with --include mongo or --include mnesia
    # services:
    #   mongodb:
    #     image: mongo:5.0
    #     ports:
    #       - 27017:27017

    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest stable versions
          - elixir: "1.20.2"
            otp: "29.0.4"
            lint: true
            coverage: true
          - elixir: "1.19.5"
            otp: "28.3.1"
          # Previous versions for compatibility
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.17.3"
            otp: "26.2"
          # - elixir: '1.16.3'
          #   otp: '25.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}

      - name: Run tests
        # CI runs only self-contained storage backends:
        # ✓ Memory, ETS, Mock, Filesystem, Zip
        #
        # Excluded (require external services):
        # ✗ S3, GCS, Azure, MongoDB, Mnesia
        #
        # Exclusions are configured in test/test_helper.exs. Wall-clock and
        # memory benchmarks (:performance, :memory) are excluded there too and
        # run in the non-blocking "Benchmarks" job below.
        # To run all tests locally:
        # mix test --include s3 --include gcs --include azure --include mongo --include mnesia
        run: mix test --trace

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Run Credo
        run: mix credo --strict

      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Create PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format github

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-docs-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Generate documentation
        run: mix docs

      - name: Check documentation coverage
        run: |
          echo "Checking for undocumented public functions..."
          mix docs --warnings-as-errors

  # Wall-clock and memory benchmarks. Shared runners vary in speed and load, so
  # these report regressions without blocking merges: a failure shows in this
  # job's log and annotations while the workflow stays green.
  benchmarks:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-benchmarks-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-benchmarks-

      - name: Install dependencies
        run: mix deps.get

      - name: Run benchmark tests
        run: mix test --only performance --only memory

  livebooks:
    name: Livebooks
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-livebooks-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-livebooks-

      - name: Install dependencies
        run: mix deps.get

      # Runs every shipped notebook cell by cell against this checkout, so a
      # change that breaks a livebook fails here rather than after release.
      - name: Run livebooks
        run: >-
          mix livebook.test --local --max 2 --timeout 900
          --paths "docs/livebooks/0[1-6]*/*.livemd"
          --paths docs/livebooks/nx_streaming.livemd

  python-interop:
    name: Python Interop (zarr ${{ matrix.zarr }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # zarr 2.x still supports Python 3.11
          - zarr: "2.18.3"
            python: "3.11"
            major: 2
            extra: "'numcodecs<0.16'"
            suite: test/ex_zarr_python_integration_test.exs
          # zarr >= 3.2 requires Python >= 3.12
          - zarr: "3.2.1"
            python: "3.12"
            major: 3
            extra: ""
            suite: test/ex_zarr_v3_python_interop_test.exs
          - zarr: "3.3.0"
            python: "3.12"
            major: 3
            extra: ""
            suite: test/ex_zarr_v3_python_interop_test.exs
          - zarr: "3.4.0"
            python: "3.12"
            major: 3
            extra: ""
            suite: test/ex_zarr_v3_python_interop_test.exs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install zarr-python
        run: |
          python -m pip install --upgrade pip
          pip install "zarr==${{ matrix.zarr }}" numpy ${{ matrix.extra }}
      - name: Generate fixtures
        run: |
          python test/support/python_fixtures/generate_fixtures.py \
            --out "${{ runner.temp }}/zarr_fixtures" \
            --zarr-major ${{ matrix.major }}
      - name: Install Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3.1"
      - run: mix deps.get
      - name: Read zarr-python fixtures with ExZarr
        env:
          EXZARR_PYTHON_FIXTURES: ${{ runner.temp }}/zarr_fixtures
        run: mix test --only python_fixtures
      - name: Run ExZarr <-> zarr-python suite
        run: mix test --include python ${{ matrix.suite }}
      - name: Run showcase example
        if: matrix.zarr == '3.4.0'
        run: mix run examples/range_aware_sharded_nx.exs
